<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" role="img" aria-labelledby="t d">
  <title id="t">Traxo: tu e-commerce en Colombia, operado desde Claude</title>
  <desc id="d">Un pedido pasa por cinco pasos que el agente hace solo: valida la dirección, cotiza transportadoras, confirma por WhatsApp, genera la guía y vigila el envío.</desc>
  <style>
    :root { --bg:#111111; --panel:#1a1a1a; --line:#2c2c2c; --ink:#F5F2EA; --muted:#A8A39A; --gold:#FFC800; }
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .glow { animation: drift 14s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    .glow2 { animation: drift 18s ease-in-out infinite alternate-reverse; transform-box: fill-box; transform-origin: center; }
    @keyframes drift { from { transform: translate(-30px, 10px) scale(1); } to { transform: translate(40px, -20px) scale(1.15); } }
    .rise { opacity: 0; animation: rise .9s cubic-bezier(.23,1,.32,1) forwards; }
    .d1 { animation-delay: .1s } .d2 { animation-delay: .25s } .d3 { animation-delay: .4s } .d4 { animation-delay: .55s } .d5 { animation-delay: .7s }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .row { animation: lit 12s ease-in-out infinite backwards; }
    .r1 { animation-delay: 1s } .r2 { animation-delay: 2.2s } .r3 { animation-delay: 3.4s } .r4 { animation-delay: 4.6s } .r5 { animation-delay: 5.8s }
    @keyframes lit { 0%, 3% { opacity: .32; } 8%, 70% { opacity: 1; } 78%, 100% { opacity: .32; } }
    .dot { animation: dot 12s ease-in-out infinite backwards; }
    .r1 .dot { animation-delay: 1s } .r2 .dot { animation-delay: 2.2s } .r3 .dot { animation-delay: 3.4s } .r4 .dot { animation-delay: 4.6s } .r5 .dot { animation-delay: 5.8s }
    @keyframes dot { 0%, 3% { fill: #3a3a3a; } 8%, 70% { fill: var(--gold); } 78%, 100% { fill: #3a3a3a; } }
    .tick { animation: tick 12s ease-in-out infinite backwards; stroke-dasharray: 20; }
    .r1 .tick { animation-delay: 1s } .r2 .tick { animation-delay: 2.2s } .r3 .tick { animation-delay: 3.4s } .r4 .tick { animation-delay: 4.6s } .r5 .tick { animation-delay: 5.8s }
    @keyframes tick { 0%, 4% { stroke-dashoffset: 20; } 10%, 70% { stroke-dashoffset: 0; } 78%, 100% { stroke-dashoffset: 20; } }
    .bar { transform-box: fill-box; transform-origin: left center; animation: bar 12s ease-in-out infinite backwards; animation-delay: 1s; }
    @keyframes bar { 0%, 3% { transform: scaleX(0); } 52%, 70% { transform: scaleX(1); } 78%, 100% { transform: scaleX(0); } }
    .float { animation: float 5s ease-in-out infinite; }
    .f2 { animation-duration: 6.5s; animation-delay: -1.5s } .f3 { animation-duration: 5.6s; animation-delay: -3s } .f4 { animation-duration: 7s; animation-delay: -2s }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    .blink { animation: blink 1.6s ease-in-out infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) {
      .glow, .glow2, .float, .blink, .row, .dot, .tick, .bar { animation: none !important; }
      .rise { animation: none !important; opacity: 1; }
      .row { opacity: 1; } .dot { fill: var(--gold); } .tick { stroke-dashoffset: 0; } .bar { transform: none; }
    }
  </style>
  <defs>
    <radialGradient id="g1"><stop offset="0" stop-color="#FFC800" stop-opacity=".30"/><stop offset="1" stop-color="#FFC800" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#2a2a2a"/></pattern>
    <clipPath id="card"><rect width="1280" height="520" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="520" fill="var(--bg)"/>
    <rect width="1280" height="520" fill="url(#dots)"/>
    <circle class="glow" cx="1040" cy="90" r="260" fill="url(#g1)"/>
    <circle class="glow2" cx="160" cy="470" r="220" fill="url(#g1)" opacity=".5"/>
  </g>
  <rect x=".5" y=".5" width="1279" height="519" rx="28" fill="none" stroke="#2c2c2c"/>

  <!-- Marca -->
  <g transform="translate(64 56)"><g class="rise d1">
    <rect width="44" height="44" rx="12" fill="var(--gold)"/>
    <path d="M12 14h20M22 14v18" stroke="#111" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="22" cy="37" r="2.2" fill="#111"/>
    <text x="58" y="31" font-size="30" font-weight="800" fill="var(--ink)" letter-spacing="-1">traxo</text>
  </g></g>

  <!-- Titular -->
  <g class="rise d2">
    <text x="64" y="190" font-size="44" font-weight="800" fill="var(--ink)" letter-spacing="-1.4">Tu e-commerce en Colombia,</text>
    <text x="64" y="244" font-size="44" font-weight="800" fill="var(--gold)" letter-spacing="-1.4">operado desde Claude.</text>
  </g>
  <g class="rise d3">
    <text x="64" y="296" font-size="20" fill="var(--muted)">Cotiza transportadoras, genera la guía, rastrea el envío,</text>
    <text x="64" y="326" font-size="20" fill="var(--muted)">atiende las novedades y vende por WhatsApp. Open source.</text>
  </g>

  <!-- Etiquetas -->
  <g class="rise d4" font-size="15" font-weight="600">
    <g transform="translate(64 372)"><g><rect width="196" height="38" rx="19" fill="#1f1f1f" stroke="#333"/><circle cx="20" cy="19" r="4" fill="var(--gold)" class="blink"/><text x="34" y="24.5" fill="var(--ink)">Plugin de Claude Code</text></g></g>
    <g transform="translate(272 372)"><g><rect width="170" height="38" rx="19" fill="#1f1f1f" stroke="#333"/><text x="85" y="24.5" fill="var(--ink)" text-anchor="middle">Local o Railway</text></g></g>
    <g transform="translate(454 372)"><g><rect width="96" height="38" rx="19" fill="#1f1f1f" stroke="#333"/><text x="48" y="24.5" fill="var(--ink)" text-anchor="middle">MIT</text></g></g>
  </g>
  <g class="rise d5">
    <text x="64" y="466" font-size="15" class="mono" fill="#7d7a73">/traxo:instalar  ·  12 skills  ·  4 agentes  ·  41 herramientas MCP</text>
  </g>

  <!-- Tarjeta del pedido -->
  <g class="rise d3">
    <rect x="690" y="64" width="526" height="392" rx="22" fill="var(--panel)" stroke="#2f2f2f"/>
    <text x="722" y="108" font-size="15" class="mono" fill="var(--muted)">PEDIDO #1042 · PEREIRA</text>
    <text x="722" y="140" font-size="26" font-weight="800" fill="var(--ink)">Contraentrega $ 89.900</text>
    <rect x="722" y="160" width="462" height="6" rx="3" fill="#2b2b2b"/>
    <rect class="bar" x="722" y="160" width="462" height="6" rx="3" fill="var(--gold)"/>

    <g font-size="19" fill="var(--ink)">
      <g class="row r1" transform="translate(722 206)"><circle class="dot" cx="14" cy="0" r="13" fill="#3a3a3a"/><path class="tick" d="M8 0l5 5 9-10" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="6">Valida la dirección (DANE)</text></g>
      <g class="row r2" transform="translate(722 252)"><circle class="dot" cx="14" cy="0" r="13" fill="#3a3a3a"/><path class="tick" d="M8 0l5 5 9-10" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="6">Cotiza varias vías y elige la mejor</text></g>
      <g class="row r3" transform="translate(722 298)"><circle class="dot" cx="14" cy="0" r="13" fill="#3a3a3a"/><path class="tick" d="M8 0l5 5 9-10" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="6">Confirma por WhatsApp</text></g>
      <g class="row r4" transform="translate(722 344)"><circle class="dot" cx="14" cy="0" r="13" fill="#3a3a3a"/><path class="tick" d="M8 0l5 5 9-10" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="6">Genera la guía y la escribe en tu tienda</text></g>
      <g class="row r5" transform="translate(722 390)"><circle class="dot" cx="14" cy="0" r="13" fill="#3a3a3a"/><path class="tick" d="M8 0l5 5 9-10" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="6">Vigila el envío y avisa al cliente</text></g>
    </g>
    <text x="722" y="436" font-size="13" fill="#7d7a73">Tú solo apruebas lo que el agente no decide solo.</text>
  </g>

  <!-- Canales flotando -->
  <g font-size="14" font-weight="700">
    <g transform="translate(1126 32)"><g class="float"><rect width="118" height="34" rx="17" fill="#128c4a"/><text x="59" y="22" fill="#fff" text-anchor="middle">WhatsApp</text></g></g>
    <g transform="translate(1146 466)"><g class="float f2"><rect width="104" height="34" rx="17" fill="#c13584"/><text x="52" y="22" fill="#fff" text-anchor="middle">Instagram</text></g></g>
    <g transform="translate(640 478)"><g class="float f3"><rect width="104" height="34" rx="17" fill="#0a7cff"/><text x="52" y="22" fill="#fff" text-anchor="middle">Messenger</text></g></g>
    <g transform="translate(618 26)"><g class="float f4"><rect width="88" height="34" rx="17" fill="#95bf47"/><text x="44" y="22" fill="#10210a" text-anchor="middle">Shopify</text></g></g>
  </g>
</svg>
