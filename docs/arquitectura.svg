<rect width="100%" height="100%" fill="#f4f3ef"/>
<text x="48" y="58" font-size="30" font-weight="800" fill="#141414" font-family="Archivo, Helvetica, Arial, sans-serif">Traxo · arquitectura del sistema</text>
<text x="48" y="84" font-size="15" fill="#6b6b68">Un agente que opera tu e-commerce en Colombia: pedidos, envíos, mensajes, anuncios y clientes en un solo lugar.</text>
<rect x="40" y="110" width="420" height="880" rx="24" fill="#ecebe6" opacity=".55"/>
<text x="62" y="140" font-size="13" font-weight="700" letter-spacing="1.6" fill="#6b6b68">PERSONAS</text>
<rect x="500" y="110" width="740" height="880" rx="24" fill="#fff7dc" opacity=".55"/>
<text x="522" y="140" font-size="13" font-weight="700" letter-spacing="1.6" fill="#6b6b68">TRAXO  ·  tu servidor (local con PGlite o Railway con Postgres)</text>
<rect x="1280" y="110" width="380" height="880" rx="24" fill="#ecebe6" opacity=".55"/>
<text x="1302" y="140" font-size="13" font-weight="700" letter-spacing="1.6" fill="#6b6b68">SERVICIOS EXTERNOS</text>
