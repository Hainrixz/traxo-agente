<text x="908" y="200" font-size="12.5" fill="#6b6b68">apps/mcp-server</text>
<text x="908" y="222" font-size="13.5" fill="#3d3d3a">36 herramientas en español</text>
<text x="908" y="243" font-size="13.5" fill="#3d3d3a">stdio (local) o HTTP /mcp (nube)</text>
<text x="908" y="264" font-size="13.5" fill="#3d3d3a">Lo que escribe, gasta o borra</text>
<text x="908" y="285" font-size="13.5" fill="#3d3d3a">pide confirm: true</text>
