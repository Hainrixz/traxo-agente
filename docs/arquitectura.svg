<text x="548" y="180" font-size="18" font-weight="700" fill="#141414">Panel web</text>
<text x="548" y="200" font-size="12.5" fill="#6b6b68">apps/dashboard</text>
<text x="548" y="222" font-size="13.5" fill="#3d3d3a">React + Vite · claro/oscuro · responsive</text>
