<text x="82" y="180" font-size="18" font-weight="700" fill="#141414">Dueño de la tienda</text>
<text x="82" y="204" font-size="13.5" fill="#3d3d3a">Abre el panel en el navegador</text>
<text x="82" y="225" font-size="13.5" fill="#3d3d3a">(computador o teléfono)</text>
<text x="82" y="246" font-size="13.5" fill="#3d3d3a">Aprueba lo importante y pregunta</text>
<rect x="64" y="330" width="372" height="190" rx="16" fill="#fff" stroke="#c9c9c5" stroke-width="1.5" filter="url(#sh)"/>
<text x="82" y="360" font-size="18" font-weight="700" fill="#141414">Claude (Claude Code)</text>
<text x="82" y="384" font-size="13.5" fill="#3d3d3a">Plugin de Traxo:</text>
<text x="82" y="405" font-size="13.5" fill="#3d3d3a">11 skills · 4 agentes · /traxo:…</text>
<text x="82" y="426" font-size="13.5" fill="#3d3d3a">Conectores propios de Claude:</text>
<text x="82" y="447" font-size="13.5" fill="#3d3d3a">Higgsfield · Meta Ads · Google · TikTok</text>
<rect x="64" y="550" width="372" height="150" rx="16" fill="#fff" stroke="#c9c9c5" stroke-width="1.5" filter="url(#sh)"/>
<text x="82" y="580" font-size="18" font-weight="700" fill="#141414">Cliente final</text>
<text x="82" y="604" font-size="13.5" fill="#3d3d3a">Escribe por WhatsApp, Instagram</text>
<text x="82" y="625" font-size="13.5" fill="#3d3d3a">o Messenger. Recibe avisos,</text>
<text x="82" y="646" font-size="13.5" fill="#3d3d3a">confirma contraentrega, reprograma</text>
<rect x="64" y="730" width="372" height="230" rx="16" fill="#fff7dc" stroke="#d99a1e" stroke-width="1.5" filter="url(#sh)"/>
<text x="82" y="760" font-size="18" font-weight="700" fill="#141414">Lo que NO sale de tu control</text>
<text x="82" y="784" font-size="13.5" fill="#3d3d3a">• Las llaves viven en .env o en las</text>
<text x="82" y="805" font-size="13.5" fill="#3d3d3a">  variables de Railway; nunca en pantalla</text>
<text x="82" y="826" font-size="13.5" fill="#3d3d3a">• Campañas siempre en pausa o borrador</text>
<text x="82" y="847" font-size="13.5" fill="#3d3d3a">• Gastar, publicar o borrar pide tu sí</text>
<text x="82" y="868" font-size="13.5" fill="#3d3d3a">• Creativos: se cotiza antes de generar</text>
